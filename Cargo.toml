[package]
name = "mathr"
version = "0.1.0"
edition = "2021"
description = "A comprehensive math library and CLI for symbolic and numerical computation, including FFT from scratch, calculus, equation solving, and plotting."
license = "Apache-2.0"
repository = "https://github.com/yingkitw/mathr"
readme = "README.md"
keywords = ["math", "fft", "calculus", "symbolic", "plotting"]
categories = ["mathematics", "science", "command-line-utilities"]

[lib]
name = "mathr"
path = "src/lib.rs"

[[bin]]
name = "mathr"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
rustyline = { version = "14.0", features = ["derive"] }
plotters = "0.3"
num-traits = "0.2"

[dev-dependencies]
approx = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1